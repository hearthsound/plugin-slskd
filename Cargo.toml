[package]
name = "hearthsound-plugin-slskd"
version = "0.2.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
description = "A Hearthsound acquisition plugin backed by a slskd instance"
repository = "https://github.com/hearthsound/plugin-slskd"

[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = "0.22.1"
hearthsound-plugin = { git = "https://github.com/hearthsound/plugin-sdk", tag = "v0.3.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.28.0", features = ["v4"] }

[lints.rust]
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
